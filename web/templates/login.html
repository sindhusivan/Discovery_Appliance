<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAO Discovery Platform | Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --tao-navy:#0D2461;--tao-blue:#1155CC;--tao-blue-mid:#2B6BE0;--tao-cyan:#0099CC;
  --bg:#F5F7FB;--bg-card:#FFFFFF;--bg-input:#F8FAFC;
  --text:#0D1B3E;--text-2:#4A5568;--text-3:#8896A7;
  --border:#E2E8F0;--border-f:#2B6BE0;
  --sh-lg:0 10px 30px rgba(0,0,0,0.1);--sh-blue:0 4px 16px rgba(43,107,224,0.22);
  --err:#DC2626;--err-bg:#FEF2F2;--err-b:#FECACA;
  --r:10px;--rs:6px;
}
[data-theme="dark"]{
  --bg:#0A0F1E;--bg-card:#111827;--bg-input:#1A2337;
  --text:#E8EEFF;--text-2:#94A3B8;--text-3:#64748B;
  --border:#1E2D4A;
  --err-bg:rgba(220,38,38,0.1);--err-b:rgba(254,202,202,0.2);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
}
.card{
  width:100%;max-width:380px;background:var(--bg-card);border:1px solid var(--border);
  border-radius:16px;box-shadow:var(--sh-lg);padding:36px 32px;
}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px;}
.logo-mark{
  width:44px;height:44px;background:linear-gradient(135deg,var(--tao-navy),var(--tao-blue-mid));
  border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:800;color:#fff;flex-shrink:0;
}
.brand-text{display:flex;flex-direction:column;}
.brand-name{font-size:16px;font-weight:700;color:var(--tao-navy);}
[data-theme="dark"] .brand-name{color:var(--text);}
.brand-sub{font-size:11px;font-weight:500;color:var(--text-3);letter-spacing:.5px;}

h1{font-size:20px;font-weight:700;margin-bottom:6px;}
.sub{font-size:13px;color:var(--text-2);margin-bottom:24px;}

.field{margin-bottom:16px;}
label{display:block;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:6px;}
input{
  width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:var(--rs);
  background:var(--bg-input);color:var(--text);font-size:14px;font-family:inherit;
  transition:border-color .15s;
}
input:focus{outline:none;border-color:var(--border-f);}

.err{
  display:flex;align-items:center;gap:8px;background:var(--err-bg);border:1px solid var(--err-b);
  color:var(--err);border-radius:var(--rs);padding:10px 12px;font-size:13px;margin-bottom:16px;
}

button{
  width:100%;padding:12px;border:none;border-radius:var(--rs);
  background:linear-gradient(135deg,var(--tao-navy),var(--tao-blue-mid));
  color:#fff;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;
  box-shadow:var(--sh-blue);margin-top:8px;transition:opacity .15s;
}
button:hover{opacity:.92;}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="logo-mark">T</div>
      <div class="brand-text">
        <span class="brand-name">TAO Discovery Platform</span>
        <span class="brand-sub">DISCOVERY APPLIANCE</span>
      </div>
    </div>
    <h1>Sign in</h1>
    <p class="sub">Enter your appliance credentials to continue.</p>

    {% if error %}
    <div class="err">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit">Sign In</button>
    </form>
  </div>
</body>
</html>
